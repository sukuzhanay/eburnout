<ion-header>

	<ion-navbar>

        <ion-buttons start>
            <button ion-button (click)="returnParent()">
                <ion-icon name="arrow-back"></ion-icon>
            </button>
        </ion-buttons>

    	<ion-title>Usuarios</ion-title>

      <ion-buttons end>
          <button navPush="AdduserPage" ion-button>
            <ion-icon name="add"></ion-icon>
          </button>
      </ion-buttons>

  	</ion-navbar>

</ion-header>


<ion-content padding>

  <ion-list>
      <ion-list-header>
          Usuarios
      </ion-list-header>
 
      <ion-item *ngFor="let profile of profileList | async" 
        detail-push navPush="EdituserPage" [navParams]="{profile:profile}">
          {{profile.email}}
      </ion-item>
  
  </ion-list>

</ion-content>
