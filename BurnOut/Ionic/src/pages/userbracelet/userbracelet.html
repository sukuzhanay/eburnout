<ion-header>

	<ion-navbar>

        <ion-buttons start>
            <button ion-button (click)="returnParent()">
                <ion-icon name="arrow-back"></ion-icon>
            </button>
        </ion-buttons>

    	<ion-title>Usuarios</ion-title>

  	</ion-navbar>

</ion-header>


<ion-content padding>

  <ion-list>

      <ion-item *ngFor="let bracelet of braceletList | async"

      </ion-item>
  
  </ion-list>

</ion-content>
