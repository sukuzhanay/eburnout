<ion-header>
 
    <ion-navbar>
        <ion-title>{{bracelet?.code}}</ion-title>
    </ion-navbar>
 
</ion-header>
 
<ion-content padding>
 
    <ion-list no-lines>
 
        <form [formGroup]="ctrls_edit">
     
            <ion-item>
                <ion-label floating>Código</ion-label>
                <ion-input formControlName="code" type="text" [class.invalid]="!ctrls_edit.controls.code.valid && (ctrls_edit.controls.code.dirty)">
                    
                </ion-input>
            </ion-item>
            <ion-item *ngIf="!ctrls_edit.controls.code.valid  && (ctrls_edit.controls.code.dirty)">
                <p>No se permiten caractéres especiales, sólo letras y números.</p>
            </ion-item>

            <ion-item>
                <ion-label floating>Client Secret</ion-label>
                <ion-input formControlName="client_secret" type="text" [class.invalid]="!ctrls_edit.controls.client_secret.valid && (ctrls_edit.controls.client_secret.dirty)">
                    
                </ion-input>
            </ion-item>
            <ion-item *ngIf="!ctrls_edit.controls.client_secret.valid  && (ctrls_edit.controls.client_secret.dirty)">
                <p>Client Secret es requerido y no puede estar vacio.</p>
            </ion-item>


            <ion-item>
                <ion-label floating>Serial</ion-label>
                <ion-input formControlName="serial" type="text" [class.invalid]="!ctrls_edit.controls.serial.valid && (ctrls_edit.controls.serial.dirty)">

                </ion-input>
            </ion-item>
     
           <ion-item *ngIf="!ctrls_edit.controls.serial.valid  && (ctrls_edit.controls.serial.dirty)">
                <p>No se permiten caractéres especiales, sólo letras y números.</p>
            </ion-item>

        </form>

    </ion-list>


    <button ion-button full color="primary" (click)="updateBracelet(bracelet)">Guardar</button>
    <button ion-button full color="warning" (click)="removeBracelet(bracelet)">Eliminar</button>
    <button ion-button full color="secondary" (click)="toListBracelet()">Cancelar</button>

</ion-content>
